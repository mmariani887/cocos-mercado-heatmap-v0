function findItem(ticker) {
  for (const list of Object.values(ITEMS_BY_INDEX)) {
    const hit = list.find((i) => i.ticker === ticker);
    if (hit) return hit;
  }
  return null;
}

function $(sel, root = document) { return root.querySelector(sel); }
function formatPct(v) {
  const pct = v * 100;
  const sign = pct > 0 ? "+" : "";
  return `${sign}${pct.toFixed(2).replace(".", ",")}%`;
}
function formatPrice(n) {
  return n.toLocaleString("es-AR");
}
function fillColor(variation) {
  // Exact 0 only → neutral. Any positive → green; any negative → red. Intensity by |%| up to ±3%.
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  if (variation === 0) return css("--slate400");
  const intensity = Math.min(Math.abs(variation) / SATURATION, 1);
  if (variation > 0) {
    if (intensity >= 0.85) return css("--green800");
    if (intensity >= 0.45) return css("--green600");
    return css("--green500");
  }
  if (intensity >= 0.85) return css("--red900");
  if (intensity >= 0.45) return css("--red800");
  return css("--red500");
}

function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "") || "mercado";
  const parts = raw.split("/");
  if (parts[0] === "ficha" && parts[1]) return { name: "ficha", ticker: parts[1].toUpperCase() };
  if (parts[0] === "list" && parts[1]) return { name: "list", chip: parts[1] };
  if (["inicio", "mercado", "fondos", "actividad", "portfolio"].includes(parts[0])) return { name: parts[0] };
  return { name: "mercado" };
}

function scrollSectorIntoView(sectorName) {
  const scroller = $("#heatmap-scroll");
  const svgEl = $("#map");
  if (!scroller || !svgEl || !sectorName) return;
  const label = [...svgEl.querySelectorAll("g.sector > text")]
    .find((t) => (t.textContent || "") === sectorName);
  if (!label) {
    scroller.scrollLeft = scroller.scrollWidth;
    return;
  }
  const x0 = parseFloat(label.getAttribute("x")) || 0;
  // Keep full sector in view (label sits near sector left; leave margin for long names).
  const pad = 8;
  const target = Math.max(0, x0 - pad);
  const max = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
  scroller.scrollLeft = Math.min(target, max);
}

function renderMap() {
  const svgEl = $("#map");
  if (!svgEl || typeof d3 === "undefined") return;
  const items = currentItems();
  const scroll = svgEl.closest(".heatmap-scroll");
  const card = svgEl.closest(".heatmap-card");
  const visible = scroll ? scroll.clientWidth : (card ? Math.max(300, card.clientWidth - 12) : 354);
  // Wide canvas for pan readability only — does NOT change volume→area mapping.
  const width = Math.max(Math.floor(visible * 1.85), 640);
  const height = 420;
  svgEl.setAttribute("width", String(width));
  svgEl.setAttribute("height", String(height));
  svgEl.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svgEl.setAttribute("preserveAspectRatio", "xMinYMid meet");

  // Strict volume proportionality: leaf value = volume (no ticker/sector floors).
  const bySector = d3.group(items, (d) => d.sector);
  const root = d3
    .hierarchy({
      children: Array.from(bySector, ([sector, sectorItems]) => ({
        sector,
        children: sectorItems.map((item) => ({ ...item, value: item.volume || 0 })),
      })),
    })
    .sum((d) => d.value || 0)
    .sort((a, b) => (b.value || 0) - (a.value || 0));

  d3.treemap().tile(d3.treemapSquarify).size([width, height]).paddingOuter(2).paddingTop(14).paddingInner(2).round(true)(root);
  const svg = d3.select(svgEl);
  svg.selectAll("*").remove();
  const sectors = svg.selectAll("g.sector").data(root.children).join("g").attr("class", "sector");
  sectors.append("text").attr("x", (d) => d.x0 + 3).attr("y", (d) => d.y0 + 11)
    .attr("fill", "#60646C").attr("font-size", 9).attr("font-weight", 600)
    .text((d) => d.data.sector || "");
  const cells = sectors.selectAll("g.cell").data((d) => d.children).join("g").attr("class", "cell")
    .style("cursor", "pointer")
    .on("click", (_, d) => navigate(`#/ficha/${d.data.ticker}`));
  cells.append("rect").attr("x", (d) => d.x0).attr("y", (d) => d.y0)
    .attr("width", (d) => Math.max(0, d.x1 - d.x0)).attr("height", (d) => Math.max(0, d.y1 - d.y0))
    .attr("rx", 4).attr("fill", (d) => fillColor(d.data.variation));
  cells.append("text").attr("x", (d) => (d.x0 + d.x1) / 2)
    .attr("y", (d) => ((d.x1 - d.x0) >= 48 && (d.y1 - d.y0) >= 34 ? (d.y0 + d.y1) / 2 - 5 : (d.y0 + d.y1) / 2 + 3))
    .attr("text-anchor", "middle").attr("fill", "#1C2024")
    .attr("font-size", (d) => (d.x1 - d.x0 > 64 ? 11 : 9)).attr("font-weight", 700)
    .text((d) => (d.x1 - d.x0 >= 26 && d.y1 - d.y0 >= 16 ? d.data.ticker : ""));
  cells.append("text").attr("x", (d) => (d.x0 + d.x1) / 2).attr("y", (d) => (d.y0 + d.y1) / 2 + 9)
    .attr("text-anchor", "middle").attr("fill", "#1C2024").attr("font-size", 9).attr("font-weight", 500)
    .text((d) => (d.x1 - d.x0 >= 48 && d.y1 - d.y0 >= 34 ? formatPct(d.data.variation) : ""));

  // Audit hook: volume vs painted tile area (padding makes shares approximate, not exact).
  window.__heatmapTileAudit = root.leaves().map((d) => ({
    ticker: d.data.ticker,
    volume: d.data.volume || 0,
    area: Math.max(0, d.x1 - d.x0) * Math.max(0, d.y1 - d.y0),
  })).sort((a, b) => b.volume - a.volume);

  const params = new URLSearchParams(location.search);
  const focus = params.get("focus");
  if (focus) requestAnimationFrame(() => scrollSectorIntoView(focus));
}

function bindChrome(root) {
  root.querySelectorAll("[data-hash]").forEach((el) => {
    el.addEventListener("click", () => navigate(el.getAttribute("data-hash")));
  });
  root.querySelectorAll("[data-ticker]").forEach((el) => {
    el.addEventListener("click", () => navigate(`#/ficha/${el.getAttribute("data-ticker")}`));
  });
  root.querySelectorAll("[data-chip]").forEach((el) => {
    el.addEventListener("click", () => navigate(`#/list/${el.getAttribute("data-chip")}`));
  });
  root.querySelectorAll("[data-index]").forEach((el) => {
    el.addEventListener("click", () => {
      selectedIndexId = el.getAttribute("data-index");
      render();
    });
  });
  root.querySelectorAll('[data-action="back"]').forEach((el) => {
    el.addEventListener("click", () => navigate("#/mercado"));
  });
  const seg = root.querySelector(".seg");
  if (seg) {
    seg.addEventListener("click", (e) => {
      const btn = e.target.closest(".seg-btn");
      if (!btn) return;
      seg.querySelectorAll(".seg-btn").forEach((b) => b.classList.toggle("on", b === btn));
      const mode = btn.getAttribute("data-seg");
      let list = [...currentItems()];
      if (mode === "gainers") list.sort((a, b) => b.variation - a.variation);
      if (mode === "losers") list.sort((a, b) => a.variation - b.variation);
      if (mode === "volume") list.sort((a, b) => b.volume - a.volume);
      const grid = $("#destacados");
      if (!grid) return;
      grid.innerHTML = list.slice(0, 8).map((item) => `
        <button type="button" class="destacado" data-ticker="${item.ticker}">
          <span class="dest-logo">${item.ticker.slice(0, 2)}</span>
          <span class="t-ValueSemiboldSmall">${item.ticker}</span>
          <span class="t-TextSemiboldSmall ${item.variation < 0 ? "t-destructive" : "t-success"}">${formatPct(item.variation)}</span>
        </button>
      `).join("");
      grid.querySelectorAll("[data-ticker]").forEach((el) => {
        el.addEventListener("click", () => navigate(`#/ficha/${el.getAttribute("data-ticker")}`));
      });
    });
  }
}

function render() {
  const route = parseRoute();
  const params = new URLSearchParams(location.search);
  const idx = params.get("index");
  if (idx && HEATMAP_INDEXES[idx]) selectedIndexId = idx;
  const phone = $("#phone");
  let html = "";
  if (route.name === "ficha") html = renderFicha(route.ticker);
  else if (route.name === "list") html = renderList(route.chip);
  else if (route.name === "inicio") html = renderTabShell("inicio", "Inicio", "Shell de tab · el heatmap vive en Mercado, atado al índice.");
  else if (route.name === "fondos") html = renderTabShell("fondos", "Fondos", "Shell de tab Fondos.");
  else if (route.name === "actividad") html = renderTabShell("actividad", "Actividad", "Shell de tab Actividad.");
  else if (route.name === "portfolio") html = renderTabShell("portfolio", "Portfolio", "Shell de tab Portfolio.");
  else html = renderMercadoHome();

  phone.innerHTML = html;
  bindChrome(phone);
  if (route.name === "mercado") {
    requestAnimationFrame(() => {
      renderMap();
      const scroller = $(".screen");
      if (!scroller) return;
      // Stay at top so indexes sit directly above the map (no jump that hides the strip).
      scroller.scrollTop = 0;
    });
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  if (!location.hash) location.hash = "#/mercado";
  else render();
});

</script>

</html>
